interface:
  display_name: "Onboarding Gates"
  short_description: "Use when an owner wants to set how changes are checked before they land - which tests run on every change, how often the full slow suite runs, and who merges. First-time setup, a repository with no gate configuration, or a team changing who lands merges. Asks about tiers, lane scope, topology and defaults, offers the checks and hooks the repository already has, and writes .thrum/policy/gates.json through project-gate-setup. Runs as one part of project-onboarding and on its own."
  default_prompt: "Use when an owner wants to set how changes are checked before they land - which tests run on every change, how often the full slow suite runs, and who merges. First-time setup, a repository with no gate configuration, or a team changing who lands merges. Asks about tiers, lane scope, topology and defaults, offers the checks and hooks the repository already has, and writes .thrum/policy/gates.json through project-gate-setup. Runs as one part of project-onboarding and on its own."

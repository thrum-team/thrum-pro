interface:
  display_name: "Onboarding Coupling"
  short_description: "Use when an owner wants to know which parts of the code change together and wants rules that keep changes small - first-time setup, a repository whose changes keep re-testing everything, or a gate setup that needs to know whether tests can run only for what changed. Measures the import graph and the recent git history, writes .thrum/policy/coupling.md, and records the keep-separate rules the owner picks. Runs as one part of project-onboarding and on its own."
  default_prompt: "Use when an owner wants to know which parts of the code change together and wants rules that keep changes small - first-time setup, a repository whose changes keep re-testing everything, or a gate setup that needs to know whether tests can run only for what changed. Measures the import graph and the recent git history, writes .thrum/policy/coupling.md, and records the keep-separate rules the owner picks. Runs as one part of project-onboarding and on its own."

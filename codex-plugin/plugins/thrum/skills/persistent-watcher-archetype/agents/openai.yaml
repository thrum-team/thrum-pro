interface:
  display_name: "Persistent Watcher Archetype"
  short_description: "Use when starting, launching or provisioning a watcher or steward - a coordinator asked to start a watcher on an agent or a roster - and when running as a persistent watcher agent that watches other agents' tmux panes, auto-approves safe modals, warns on context, and escalates up a parent-reference tree. Starting one means running resources/start-watcher.sh, never a hand-built monitor. Distinct from watcher-archetype (the wake-run-exit scan/emit/report substrate) — this archetype stays alive."
  default_prompt: "Use when starting, launching or provisioning a watcher or steward - a coordinator asked to start a watcher on an agent or a roster - and when running as a persistent watcher agent that watches other agents' tmux panes, auto-approves safe modals, warns on context, and escalates up a parent-reference tree. Starting one means running resources/start-watcher.sh, never a hand-built monitor. Distinct from watcher-archetype (the wake-run-exit scan/emit/report substrate) — this archetype stays alive."

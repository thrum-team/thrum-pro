interface:
  display_name: "Routing Messages Across Daemons"
  short_description: "Use the moment you think you can't reach an agent - you can't see an agent, an agent is on another box or another org or another daemon, a note or another agent says there is no route to it, you're about to ask someone to forward or pass on or relay a message, you're about to send through a coordinator because you can't message the target yourself, or a send says unknown recipient. Loads how to reach any agent yourself."

interface:
  display_name: "Configure Roles"
  short_description: "Detect environment and set up role-based preambles for your Thrum agents. Writes the shipped role templates to .thrum/role_templates/ and your project's own text into a configure-roles block of .thrum/policy/roles/<role>.md, which auto-apply on agent registration."
  default_prompt: "Detect environment and set up role-based preambles for your Thrum agents. Writes the shipped role templates to .thrum/role_templates/ and your project's own text into a configure-roles block of .thrum/policy/roles/<role>.md, which auto-apply on agent registration."

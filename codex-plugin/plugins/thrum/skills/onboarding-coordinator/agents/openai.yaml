interface:
  display_name: "Onboarding Coordinator"
  short_description: "Use when an owner wants the coordinator agent that runs everything else set up - its role block, the owner's rulings, the hourly reminder, the drift-check and dash-tick monitors, and where it keeps its state. First-time setup, a repository whose coordinator has no written rules, or a licence change that needs the other setup. Installs the monitors, writes the coordinator's role block and the rulings, and runs configure-roles. Runs as the last part of project-onboarding and on its own."
  default_prompt: "Use when an owner wants the coordinator agent that runs everything else set up - its role block, the owner's rulings, the hourly reminder, the drift-check and dash-tick monitors, and where it keeps its state. First-time setup, a repository whose coordinator has no written rules, or a licence change that needs the other setup. Installs the monitors, writes the coordinator's role block and the rulings, and runs configure-roles. Runs as the last part of project-onboarding and on its own."
